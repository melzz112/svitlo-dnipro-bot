services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/svitlo.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Перший раз: docker compose run --rm -it userbot  (ввести номер і код)
  # Потім:      docker compose --profile userbot up -d
  userbot:
    build: .
    command: python userbot.py
    profiles: ["userbot"]
    env_file: .env
    environment:
      DB_PATH: /data/svitlo.db
      SESSION_PATH: /data/userbot
    volumes:
      - ./data:/data
    restart: unless-stopped
